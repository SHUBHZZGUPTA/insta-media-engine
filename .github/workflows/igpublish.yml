name: igpublish
# A Reel is queued by pushing a branch queue/<id> holding publish.json + video.mp4
# (with a copy of this file so the push starts a run). Every run scans all queue
# branches, waits for any slot due within 25 min, publishes, records the result on
# main (outputs/igpublish/<id>.json) and deletes the branch. The 10-minute schedule
# picks up posts queued for later slots.
on:
  push:
    branches: ['queue/**']
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: igpublish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Publish due Reels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_TOKEN_BHUGOL: ${{ secrets.IG_TOKEN_BHUGOL }}
        run: python3 tools/ig_publish.py
      - name: Record results on main
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -qm "igpublish outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
