name: igtoken
# Weekly refresh of the Instagram tokens so they never reach their ~60-day expiry.
on:
  schedule:
    - cron: '13 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests pynacl
      - name: Refresh
        env:
          IG_TOKEN_BHUGOL: ${{ secrets.IG_TOKEN_BHUGOL }}
          IG_SECRETS_PAT: ${{ secrets.IG_SECRETS_PAT }}
        run: python3 tools/ig_token.py bhugol
      - name: Record
        if: always()
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -qm "igtoken outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
