name: igcheck
# Push jobs/igcheck/<id>.json {"id", "accounts": ["bhugol"]} to main to confirm tokens work.
on:
  push:
    branches: [main]
    paths: ['jobs/igcheck/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests
      - name: Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_TOKEN_BHUGOL: ${{ secrets.IG_TOKEN_BHUGOL }}
        run: |
          mkdir -p outputs/igcheck
          for f in $(git diff --name-only HEAD~1 HEAD -- jobs/igcheck/ 2>/dev/null || ls jobs/igcheck/*.json); do
            [ -f "$f" ] || continue
            python3 tools/ig_check.py "$f" "outputs/igcheck/$(basename "$f")" || true
          done
      - name: Record
        run: |
          git config user.name "media-engine-bot"
          git config user.email "media-engine-bot@users.noreply.github.com"
          git add outputs || true
          git diff --cached --quiet && exit 0
          git commit -qm "igcheck outputs [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
